spring:
  application:
    name: hedge-ingestor
  main:
    web-application-type: servlet

server:
  port: ${HEDGE_INGESTOR_PORT:8081}
  shutdown: graceful

hedge:
  db:
    url: ${HEDGE_DB_URL:jdbc:postgresql://localhost:5432/hedge_trading_test}
    user: ${HEDGE_DB_USER:${user.name}}
    password: ${HEDGE_DB_PASSWORD:}
    pool-size: ${HEDGE_DB_POOL_SIZE:5}
  ingest:
    drop-directory: ${HEDGE_DROP_DIR:${user.home}/Desktop/Hedge_Trading/data/drop}
    archive-directory: ${HEDGE_ARCHIVE_DIR:${user.home}/Desktop/Hedge_Trading/data/archive}
    poll-interval: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: hedge-ingestor
