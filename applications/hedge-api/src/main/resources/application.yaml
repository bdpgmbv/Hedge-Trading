server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: hedge-api
  lifecycle:
    timeout-per-shutdown-phase: 25s

hedge:
  db:
    url: ${HEDGE_DB_URL:jdbc:postgresql://localhost:5432/hedge_trading_test}
    user: ${HEDGE_DB_USER:${user.name}}
    password: ${HEDGE_DB_PASSWORD:}
    pool-size: ${HEDGE_DB_POOL_SIZE:10}
  api:
    max-page-size: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: hedge-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 10ms,50ms,100ms,200ms,500ms,1s